<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F7F4EC">
  <title>Pace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="phone">
    <main class="screen">
      <header class="top">
        <p class="eyebrow">Snacks</p>
        <h1 class="title">Find the cheapest spot</h1>
      </header>

      <form class="search" role="search" onsubmit="return false">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M16 16l4.5 4.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <input id="q" type="search" placeholder="Search a snack or drink" autocomplete="off"
               autocapitalize="off" spellcheck="false" aria-label="Search items">
        <button type="button" class="clear" id="clear" aria-label="Clear search" hidden>×</button>
      </form>

      <section id="results" aria-live="polite"></section>
    </main>
  </div>

  <script src="data/prices.js"></script>
  <script src="app.js"></script>
</body>
</html>
